name = "miami-listing-scout-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[triggers]
crons = ["0 */12 * * *"]  # Every 12h (00:00 and 12:00 UTC) — handler skips based on frequency config

[[kv_namespaces]]
binding = "SCOUT_CONFIG"
id = "265b26f823ff409880db18ce68062b67"
preview_id = "bef3fa3569114488a5fa4fb5e9e4d759"

[[kv_namespaces]]
binding = "SEEN_LISTINGS"
id = "def844544b384b9fa489ecfcd42e4cdf"
preview_id = "7040cce626ad4c25a5c84f5cc583a143"

[vars]
MOCK_MODE = "false"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Set these via `wrangler secret put` for production
# or in .dev.vars for local development:
# BRIDGE_API_TOKEN=
# ANTHROPIC_API_KEY=
# RESEND_API_KEY=
# CONFIG_API_KEY=
# RPR_API_TOKEN=          (optional — RPR enrichment, requires NAR membership)
